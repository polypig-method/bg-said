name: BG Said daily scan

on:
  schedule:
    # 22:00 UTC Mon–Fri = 17:00 New York (winter) / 18:00 (summer) = 05:00 Thailand.
    # GitHub may start scheduled jobs a few minutes late.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send the notification even if the market was closed today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bgsaid
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Graham screen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python engine/bgsaid.py ${{ inputs.force && '--force' || '' }}

      - name: Publish data
        run: |
          git config user.name "bgsaid-bot"
          git config user.email "bgsaid-bot@users.noreply.github.com"
          git add docs/data engine/sp500.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%F)"
          git push

      - name: Tell the phone the run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -s -H "Title: BG Said update failed" -H "Tags: warning" -H "Click: $RUN_URL" \
            -d "Today's scan did not finish. Tap to see the log." "https://ntfy.sh/$NTFY_TOPIC"
